name: Sync motion site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-motion.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy latest motion version
        run: |
          curl -fsSL https://raw.githubusercontent.com/PapinaBraga/vr-camp/main/index.html -o index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<label>Телефон<input required type="tel" placeholder="+7 ___ ___-__-__"></label>', '<label>Email<input required type="email" placeholder="name@example.com"></label>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit synced site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Sync motion VR Camp site"
          git push
